<svg width="275" height="430" viewBox="0 0 275 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d3a00"/>
      <stop offset="35%" style="stop-color:#c47f17"/>
      <stop offset="65%" style="stop-color:#e8b84b"/>
      <stop offset="100%" style="stop-color:#f5d07a"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="50%" style="stop-color:#f0d060"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="275" height="430" rx="28" fill="url(#goldGrad)"/>

  <!-- Shimmer overlay -->
  <rect width="275" height="430" rx="28" fill="white" opacity="0.08"/>

  <!-- Top section -->
  <text x="22" y="42" fill="white" font-size="22" font-weight="800" font-family="system-ui">Novio</text>
  <text x="22" y="58" fill="rgba(255,255,255,0.7)" font-size="10" font-family="system-ui">SBM Bank</text>

  <!-- SELECT badge -->
  <rect x="200" y="26" width="55" height="22" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="210" y="42" fill="white" font-size="9" font-weight="700" font-family="system-ui">SELECT</text>

  <!-- Chip -->
  <rect x="22" y="280" width="48" height="36" rx="6" fill="url(#chipGrad)"/>
  <line x1="22" y1="292" x2="70" y2="292" stroke="#a08632" stroke-width="1"/>
  <line x1="22" y1="304" x2="70" y2="304" stroke="#a08632" stroke-width="1"/>
  <line x1="46" y1="280" x2="46" y2="316" stroke="#a08632" stroke-width="1"/>

  <!-- Card number -->
  <text x="22" y="345" fill="white" font-size="17" font-weight="600" letter-spacing="3" font-family="monospace">5241  1234  5678  9012</text>

  <!-- Card holder label -->
  <text x="22" y="378" fill="rgba(255,255,255,0.6)" font-size="9" font-family="system-ui">CARD HOLDER</text>
  <text x="22" y="395" fill="white" font-size="13" font-weight="700" font-family="system-ui">YOUR NAME</text>

  <!-- RuPay logo -->
  <text x="185" y="400" fill="white" font-size="26" font-weight="900" font-family="system-ui">RuPay</text>
</svg>